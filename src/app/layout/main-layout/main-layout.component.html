<div class="layout">

  <!-- SIDEBAR -->
  <aside
  class="sidebar"
  [class.collapsed]="isSidebarCollapsed"
  [class.mobile-open]="isMobileSidebarOpen"
>

    <div class="logo-section">
      <div class="logo">P</div>

      <div class="brand" *ngIf="!isSidebarCollapsed">
        <h2>PayrollPro</h2>
        <small>Enterprise HRMS</small>
      </div>
      <button
  class="mobile-close-btn"
  *ngIf="isMobileSidebarOpen"
  (click)="isMobileSidebarOpen = false"
>
  <span class="material-icons">close</span>
</button>
    </div>

    <ul class="menu">

      <li *ngFor="let item of navItems">

        <!-- SIMPLE LINK -->
        <a
          *ngIf="item.route"
          [routerLink]="item.route"
          (click)="closeMobileSidebar()"
          routerLinkActive="active"
          class="menu-link"
          [title]="item.label"
          [attr.aria-label]="item.label"
        >
          <span class="material-icons icon">
            {{ item.icon }}
          </span>

          <span *ngIf="!isSidebarCollapsed">
            {{ item.label }}
          </span>
        </a>

        <!-- DROPDOWN -->
       <div *ngIf="item.children">

  <div
    class="menu-link parent-link"
    (click)="toggleMenu(item.label)"
    [title]="item.label"
    [attr.aria-label]="item.label"
  >

    <div class="menu-title">

      <span class="material-icons icon">
        {{ item.icon }}
      </span>

      <span *ngIf="!isSidebarCollapsed">
        {{ item.label }}
      </span>

    </div>

    <span
      *ngIf="!isSidebarCollapsed"
      class="material-icons arrow"
    >
      {{
        expandedMenu === item.label
        ? 'expand_less'
        : 'expand_more'
      }}
    </span>

  </div>

  <div
    class="submenu"
    *ngIf="expandedMenu === item.label && !isSidebarCollapsed"
  >

    <a
      *ngFor="let child of item.children"
      [routerLink]="child.route"
      (click)="closeMobileSidebar()"
      routerLinkActive="active"
      class="submenu-link"
      [title]="child.label"
      [attr.aria-label]="child.label"
    >

      <span class="material-icons small-icon">
        {{ child.icon }}
      </span>

      {{ child.label }}

    </a>

  </div>

</div>

      </li>

    </ul>

  </aside>

  <!-- MAIN -->
  <div class="main-content">

    <!-- TOPBAR -->
    <header class="topbar">

      <div class="topbar-left">
        <button class="toggle-btn" (click)="toggleSidebar()" title="Toggle menu" aria-label="Toggle menu">
          <span class="material-icons">menu</span>
        </button>

        <button
          *ngIf="showBackButton"
          class="back-btn"
          type="button"
          (click)="goBack()"
          title="Go back"
          aria-label="Go back"
        >
          <span class="material-icons">arrow_back</span>
          <span>Back</span>
        </button>
      </div>

      <div class="search-box">
        <span class="material-icons">search</span>

        <input
          type="text"
          placeholder="Search employees, payroll..."
          [(ngModel)]="search"
        />
      </div>

      <div class="profile">
        <div class="avatar">
          {{ avatar }}
        </div>

        <div class="profile-info">
          <strong>{{ roleName }}</strong>
          <small>{{ username }}</small>
        </div>
        <button class="logout-btn" type="button" (click)="onProfileMenu('logout')" title="Logout" aria-label="Logout">
          <span class="material-icons">logout</span>
          <span class="logout-text">Logout</span>
        </button>
      </div>

    </header>

    <!-- PAGE CONTENT -->
    <main class="page-content">
      <div class="route-stage" [@routeFade]="prepareRoute(pageOutlet)">
        <router-outlet #pageOutlet="outlet"></router-outlet>
      </div>
    </main>

  </div>

</div>
