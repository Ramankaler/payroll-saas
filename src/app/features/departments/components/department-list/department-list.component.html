<div class="dept-list-container">
  <!-- Page Header -->
  <div class="page-header">
    <div class="header-text">
      <h1 class="page-title">Departments</h1>
      <p class="page-subtitle">Manage your organization departments</p>
    </div>
    <button mat-raised-button color="primary" (click)="addDepartment()" class="add-btn">
      <mat-icon>add</mat-icon>
      Add Department
    </button>
  </div>

  <!-- Table Card -->
  <mat-card class="table-card">
    <!-- Toolbar -->
    <div class="table-toolbar">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search departments</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput [(ngModel)]="searchTerm" (input)="applyFilter($event)" placeholder="Name...">
        <button *ngIf="searchTerm" matSuffix mat-icon-button aria-label="Clear" (click)="searchTerm=''">
          <mat-icon>close</mat-icon>
        </button>
      </mat-form-field>
      <div class="toolbar-right">
        <span class="count-badge">{{ filteredDepartments.length }} departments</span>
        <button mat-icon-button (click)="loadDepartments()" matTooltip="Refresh">
          <mat-icon>refresh</mat-icon>
        </button>
      </div>
    </div>

    <!-- Table -->
    <div class="table-wrapper">
      <table mat-table [dataSource]="pagedDepartments" matSort (matSortChange)="sortData($event)" class="dept-table">

        <ng-container matColumnDef="deptName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let dept">

  <div class="d-flex align-items-center gap-2">

    <span class="badge bg-primary">
      {{ dept.tag || (dept.deptName?.substring(0,2) | uppercase) }}
    </span>

    <span class="fw-semibold">
      {{ dept.deptName }}
    </span>

  </div>

</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let dept" class="actions-cell">
            <button mat-icon-button color="primary" (click)="editDepartment(dept)" matTooltip="Edit">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteDepartment(dept)" matTooltip="Delete">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
      <mat-paginator
  [length]="filteredDepartments.length"
  [pageSize]="pageSize"
  [pageSizeOptions]="[5, 10, 20]"
  (page)="onPageChange($event)">
</mat-paginator>
    </div>
  </mat-card>
</div>
