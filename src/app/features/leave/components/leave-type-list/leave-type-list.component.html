<div class="container-fluid py-4">
  <div class="page-header">
    <div>
      <div class="page-kicker">Leave Setup</div>
      <h1 class="page-title">Leave Types</h1>
      <p class="page-subtitle">Create and search leave categories.</p>
    </div>

    <input [(ngModel)]="searchTerm" (input)="applyFilter()" class="form-control search-box" placeholder="Search types...">
  </div>

  <div class="row">
    <div class="col-12">
      <div class="card">
        <div class="card-header">
          <div class="row align-items-center">
            <div class="col">
              <h5>Add New Leave Type</h5>
            </div>
            <div class="col-auto">
              <div class="input-group input-group-sm">
                <input [(ngModel)]="newTypeName" (keyup.enter)="addType()" class="form-control" placeholder="Type name">
                <button (click)="addType()" [disabled]="!newTypeName.trim()" class="btn btn-primary" title="Add Leave Type">
                  <span class="material-icons">add</span>
                  Add
                </button>
              </div>
            </div>
          </div>
        </div>
          <div class="table-responsive">
            <table class="table table-hover mb-0">
              <thead class="table-light">
                <tr>
                  <th>Leave Type Name</th>
                  <th style="width: 150px;">Actions</th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let type of filteredTypes">
                  <td>{{ type.leaveName }}</td>
                  <td>
                  </td>
                </tr>
                <tr *ngIf="filteredTypes.length === 0">
                  <td colspan="2" class="empty-row">
                    No leave types found
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
      </div>
    </div>
  </div>
</div>
