<div class="container-fluid py-4">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
          <h4 class="mb-0">Edit Leave Request</h4>
          <a routerLink="/leave" class="btn btn-sm btn-outline-secondary">
            <i class="material-icons">arrow_back</i> Back
          </a>
        </div>
        <div class="card-body">
          <div *ngIf="isReadonly" class="alert alert-warning">
  This leave request is already {{ leave.status }} and cannot be edited.
</div>
          <form #leaveForm="ngForm">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Employee</label>
                <select [(ngModel)]="leave.empID" name="empID" class="form-select">
                  <option value="">Select Employee</option>
                  <option *ngFor="let emp of employees" [value]="emp.empID">
                    {{ emp.firstName }} {{ emp.lastName }} ({{ emp.empCode }})
                  </option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Leave Type</label>
                <select [(ngModel)]="leave.leaveTypeID" name="leaveTypeID" class="form-select">
                  <option value="">Select Leave Type</option>
                  <option *ngFor="let type of leaveTypes" [value]="type.leaveTypeID">
                    {{ type.leaveTypeName }}
                  </option>
                </select>
              </div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">From Date</label>
                <input [(ngModel)]="leave.startDate" name="startDate" type="date" class="form-control" [disabled]="isReadonly">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">To Date</label>
                <input [(ngModel)]="leave.endDate" name="endDate" type="date" class="form-control" [disabled]="isReadonly">
              </div>
            </div>

            <div class="row mb-3">
              <div class="col-md-6">
                <div class="form-check">
                  <input [(ngModel)]="leave.isHalfDay" name="isHalfDay" class="form-check-input" type="checkbox" id="halfDay" [disabled]="isReadonly">
                  <label class="form-check-label" for="halfDay">
                    Half Day
                  </label>
                </div>
              </div>
              <div class="col-md-6" *ngIf="leave.isHalfDay">
                <label class="form-label">Half Day Type</label>
                <select [(ngModel)]="leave.halfDayType" name="halfDayType" class="form-select" [disabled]="isReadonly">
                  <option *ngFor="let type of halfDayTypes" [value]="type">{{ type }}</option>
                </select>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label">Reason</label>
              <textarea [(ngModel)]="leave.reason" name="reason" rows="4"
                class="form-control" placeholder="Enter reason..." [disabled]="isReadonly"></textarea>
            </div>

            <div class="d-flex gap-2">
              <button type="button" (click)="save()" class="btn btn-primary" [disabled]="isReadonly">
                Update Leave Request
              </button>
              <a routerLink="/leaves" class="btn btn-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
