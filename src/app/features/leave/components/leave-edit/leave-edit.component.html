<div class="container-fluid">

  <div class="row mt-1">
    <div class="col-sm">
      <div class="card">
        <div class="card-header">Edit Leave</div>
        <div class="card-body">
          <div class="row m1-2">
            <div class="col-sm-6">
              <label for="">Leave ID</label>
              <input type="text" class="form-control fw-bold" [(ngModel)]="leave.leaveID" readonly>

            </div>
            <div class="col-sm-6">
              <label for="">Employee Name</label>
              <input type="text" class="form-control fw-bold" [(ngModel)]="leave.EMPLOYEENAME" readonly>
            </div>
          </div>

          <div class="row mt-2">
            <div class="col-sm-6">
              <label for="" class="fw-bold"> Start Date </label>
              <input class="form-control" type="date" [(ngModel)]="leave.startDate">
            </div>
            <div class="col-sm-6">
              <label for="" class="fw-bold"> End Date </label>
              <input class="form-control" type="date" [(ngModel)]="leave.endDate">
            </div>
          </div>

          <div class="row mt-2">
            <div class="col-sm-6">
              <label for="" class="fw-bold">Leave Types</label>

              <select class="form-control" [(ngModel)]="leave.leaveTypeID">
                <option *ngFor="let leaveType of leaveTypes"
                [value]="leaveType.leaveTypeID">
                  {{ leaveType.leaveName }}
                </option>
              </select>
            </div>
            <div class="col-sm-6">
              <label class="fw-bold">Created Date</label>
              <input type="text" class="form-control" [(ngModel)]="leave.createdAt" readonly>
            </div>
          </div>

          <div class="row mt-2">
            <div class="col-sm">
              <label for="" class="fw-bold">Reason</label>
              <textarea class="form-control" rows="3" [(ngModel)]="leave.reason"></textarea>
            </div>

          <div class="row mt-2">
            <div class="col-sm-6">
              <button class="btn btn-primary" (click)="updateLeave()">Update</button>
            </div>
        </div>
      </div>
    </div>
  </div>
</div>
