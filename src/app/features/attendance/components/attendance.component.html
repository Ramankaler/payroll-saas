<div class="attendance-container">
  <mat-card class="import-card">
    <h2>Import Attendance CSV</h2>
    <div class="file-input-wrapper">
      <input type="file" accept=".csv" (change)="onFileSelected($event)" />
      <button mat-raised-button color="primary" (click)="importCsv()" [disabled]="!file || uploading">
        {{ uploading ? 'Uploading...' : 'Import CSV' }}
      </button>
    </div>
    <div *ngIf="uploading">
      <mat-progress-bar mode="determinate" [value]="uploadProgress"></mat-progress-bar>
      <p>{{ uploadProgress }}%</p>
    </div>
    <div *ngIf="importResult" class="result" [class.success]="importResult.success" [class.error]="!importResult.success">
      {{ importResult.message }}
    </div>
  </mat-card>

  <mat-card class="table-card">
    <h2>Attendance Logs</h2>
    <table mat-table [dataSource]="attendanceLogs" class="attendance-table">
      <ng-container matColumnDef="employeeName">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let log">{{ log.employeeName }}</td>
      </ng-container>
      <ng-container matColumnDef="punchIn">
        <th mat-header-cell *matHeaderCellDef>Punch In</th>
        <td mat-cell *matCellDef="let log">{{ log.punchIn || '-' }}</td>
      </ng-container>
      <ng-container matColumnDef="punchOut">
        <th mat-header-cell *matHeaderCellDef>Punch Out</th>
        <td mat-cell *matCellDef="let log">{{ log.punchOut || '-' }}</td>
      </ng-container>
      <ng-container matColumnDef="shift">
        <th mat-header-cell *matHeaderCellDef>Shift</th>
        <td mat-cell *matCellDef="let log">{{ log.shift }}</td>
      </ng-container>
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let log">
          <span class="status-badge" [ngClass]="log.status.toLowerCase()">{{ log.status }}</span>
        </td>
      </ng-container>
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </mat-card>
</div>
