<div class="reports-container">
  <mat-card>
    <h2>Reports (MVP)</h2>

    <div class="form-grid">
      <mat-form-field appearance="outline">
        <mat-label>From (UTC)</mat-label>
        <input matInput type="date" [(ngModel)]="fromUtc" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>To (UTC)</mat-label>
        <input matInput type="date" [(ngModel)]="toUtc" />
      </mat-form-field>
    </div>

    <button mat-raised-button color="primary" (click)="load()">Load Attendance Report</button>

    <div *ngIf="result" class="result">
      <pre>{{ result | json }}</pre>
    </div>
  </mat-card>
</div>
