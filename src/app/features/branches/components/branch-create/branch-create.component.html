<div class="container mt-4">

  <h3>Add Branch</h3>

  <div class="mb-2">
    <label>Name</label>
    <input [(ngModel)]="branch.branchName" class="form-control">
  </div>

  <div class="mb-3">
    <label>Location</label>
    <input [(ngModel)]="branch.location" class="form-control">
  </div>

  <button class="btn btn-primary" (click)="save()">Save</button>

</div>
