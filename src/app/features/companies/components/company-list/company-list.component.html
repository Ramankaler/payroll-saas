<div class="container-fluid">
  <div class="page-header">
    <div>
      <div class="page-kicker">Setup</div>
      <h1 class="page-title">Company</h1>
      <p class="page-subtitle">Review and update the current company profile.</p>
    </div>
  </div>

  <div class="card" *ngIf="company as c">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h5>{{ c.companyName }}</h5>
      <button
        class="btn btn-sm btn-outline-primary"
        (click)="edit(c.compID)"
        title="Edit Company">
        <span class="material-icons">edit</span>
        Edit
      </button>
    </div>

    <div class="table-responsive">
      <table class="table table-hover align-middle">
        <thead>
          <tr>
            <th>Name</th>
            <th>Industry</th>
            <th>Country</th>
            <th>Currency</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td class="fw-semibold">{{ c.companyName }}</td>
            <td>{{ c.industry || '-' }}</td>
            <td>{{ c.country || '-' }}</td>
            <td>{{ c.currency || '-' }}</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
