<div style="display:flex;justify-content:center;padding:24px;">
  <mat-card style="width:420px;">
    <h2>Login</h2>

    <form
      #loginForm="ngForm"
      (ngSubmit)="onSubmit(loginForm)">

      <mat-form-field appearance="fill" style="width:100%;">
        <mat-label>Company ID</mat-label>

        <input
          matInput
          type="number"
          name="compID"
          [(ngModel)]="credentials.compID"
          #companyControl="ngModel"
          required
          min="1">

        <mat-error
          *ngIf="companyControl.invalid && companyControl.touched">
          Valid company ID is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" style="width:100%;">
        <mat-label>Username</mat-label>

        <input
          matInput
          type="text"
          name="username"
          [(ngModel)]="credentials.username"
          #usernameControl="ngModel"
          required
          maxlength="254">

        <mat-error
          *ngIf="usernameControl.invalid && usernameControl.touched">
          Username is required
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="fill" style="width:100%;">
        <mat-label>Password</mat-label>

        <input
          matInput
          type="password"
          name="password"
          [(ngModel)]="credentials.password"
          #passwordControl="ngModel"
          required
          maxlength="128">

        <mat-error
          *ngIf="passwordControl.invalid && passwordControl.touched">
          Password is required
        </mat-error>
      </mat-form-field>

      <div style="display:flex;align-items:center;gap:12px;margin-top:12px;">
        <button
          mat-raised-button
          color="primary"
          type="submit"
          [disabled]="
            loginForm.invalid ||
            (authState$ | async)?.loading
          ">
          Login
        </button>

        <mat-progress-spinner
          *ngIf="(authState$ | async)?.loading"
          diameter="24"
          mode="indeterminate">
        </mat-progress-spinner>
      </div>

      <div
        style="color:#b00020;margin-top:12px;"
        *ngIf="(authState$ | async)?.error as error">
        {{ error }}
      </div>
    </form>
  </mat-card>
</div>
