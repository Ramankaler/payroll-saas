<div style="display:flex;justify-content:center;padding:48px 16px;">
  <mat-card style="width:100%;max-width:460px;padding:24px;">
    <h2>Change your password</h2>
    <p>This is required before you can use the HRMS.</p>

    <form #passwordForm="ngForm" (ngSubmit)="submit(passwordForm)">
      <mat-form-field appearance="fill" style="width:100%;">
        <mat-label>Current password</mat-label>
        <input matInput type="password" name="currentPassword"
          [(ngModel)]="model.currentPassword" required maxlength="128">
      </mat-form-field>

      <mat-form-field appearance="fill" style="width:100%;">
        <mat-label>New password</mat-label>
        <input matInput type="password" name="newPassword"
          [(ngModel)]="model.newPassword" required minlength="8" maxlength="128">
      </mat-form-field>

      <mat-form-field appearance="fill" style="width:100%;">
        <mat-label>Confirm new password</mat-label>
        <input matInput type="password" name="confirmPassword"
          [(ngModel)]="model.confirmPassword" required minlength="8" maxlength="128">
      </mat-form-field>

      <div *ngIf="error" style="color:#b00020;margin-bottom:12px;">
        {{ error }}
      </div>

      <button mat-raised-button color="primary" type="submit"
        [disabled]="loading || passwordForm.invalid">
        {{ loading ? 'Changing...' : 'Change password' }}
      </button>
    </form>
  </mat-card>
</div>
