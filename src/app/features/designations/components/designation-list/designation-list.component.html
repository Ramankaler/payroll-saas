<div class="desig-list-container">
  <!-- Page Header -->
  <div class="page-header">
    <div class="header-text">
      <h1 class="page-title">Designations</h1>
      <p class="page-subtitle">Manage employee designations and roles</p>
    </div>
    <button mat-raised-button color="primary" (click)="addDesignation()" class="add-btn">
      <mat-icon>add</mat-icon>
      Add Designation
    </button>
  </div>

  <!-- Table Card -->
  <mat-card class="table-card">
    <!-- Toolbar -->
    <div class="table-toolbar">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search designations</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput [(ngModel)]="searchTerm" (input)="applyFilter($event)" placeholder="Name...">
        <button *ngIf="searchTerm" matSuffix mat-icon-button aria-label="Clear" (click)="searchTerm=''">
          <mat-icon>close</mat-icon>
        </button>
      </mat-form-field>
      <div class="toolbar-right">
        <span class="count-badge">{{ filteredDesignations.length }} designations</span>
        <button mat-icon-button (click)="fetch()" matTooltip="Refresh">
          <mat-icon>refresh</mat-icon>
        </button>
      </div>
    </div>

    <!-- Table -->
    <div class="table-wrapper">
      <table mat-table [dataSource]="filteredDesignations" class="desig-table">

        <ng-container matColumnDef="desigName">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let desig">

  <div class="d-flex align-items-center gap-2">

    <span class="badge bg-primary">
      {{ desig.tag || (desig.desigName?.substring(0,2) | uppercase) }}
    </span>

    <span class="fw-semibold">
      {{ desig.desigName }}
    </span>

  </div>

</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let desig" class="actions-cell">
            <button mat-icon-button color="primary" (click)="editDesignation(desig)" matTooltip="Edit">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteDesignation(desig)" matTooltip="Delete">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>
  </mat-card>
</div>
