<h2 mat-dialog-title>Add New Employee</h2>
<mat-dialog-content>
  <form [formGroup]="form" class="dialog-form">
    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Employee ID</mat-label>
        <input matInput formControlName="employeeId" placeholder="EMP-001" />
      </mat-form-field>
    </div>
    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>First Name</mat-label>
        <input matInput formControlName="firstName" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Last Name</mat-label>
        <input matInput formControlName="lastName" />
      </mat-form-field>
    </div>
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" type="email" />
    </mat-form-field>
    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Phone</mat-label>
        <input matInput formControlName="phone" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Gender</mat-label>
        <mat-select formControlName="gender">
          <mat-option value="Male">Male</mat-option>
          <mat-option value="Female">Female</mat-option>
          <mat-option value="Other">Other</mat-option>
        </mat-select>
      </mat-form-field>
    </div>
    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Date of Birth</mat-label>
        <input matInput formControlName="dob" type="date" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Joining Date</mat-label>
        <input matInput formControlName="joiningDate" type="date" />
      </mat-form-field>
    </div>
    <div class="form-row">
      <mat-form-field appearance="outline">
        <mat-label>Basic Salary</mat-label>
        <input matInput formControlName="basicSalary" type="number" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Allowances</mat-label>
        <input matInput formControlName="allowancesAmount" type="number" />
      </mat-form-field>
    </div>
    <mat-form-field appearance="outline">
      <mat-label>Work Location</mat-label>
      <input matInput formControlName="workLocation" />
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="dialogRef.close()">Cancel</button>
  <button mat-raised-button color="primary" (click)="submit()" [disabled]="form.invalid">
    Add Employee
  </button>
</mat-dialog-actions>
